name: Daily JARVIS AI News Agent

on:
  schedule:
    # Runs every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  run-jarvis-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai feedparser beautifulsoup4

      - name: Run JARVIS Daily Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_run.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_news.md
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "JARVIS: Automated Daily AI News Update" && git push)
